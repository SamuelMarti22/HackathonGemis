version: "3.9"

# Arranque de referencia: client (React) + server (API stub) + db (Postgres).
# El server solo expone endpoints de salud/placeholder: la lógica de RAG,
# generación de documentos y streaming NO está implementada todavía.

services:
  client:
    build:
      context: ./client
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:4000
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server

  server:
    build:
      context: ./server
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DATABASE_URL=postgres://lexi:lexi@db:5432/lexi
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=lexi
      - POSTGRES_PASSWORD=lexi
      - POSTGRES_DB=lexi
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data:
