services:
  client:
    build:
      context: ./client
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server

  server:
    build: ./server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/tutor_juridico
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: tutor_juridico
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PDF_PATH: /app/RAG/COLOMBIA-Constitucion.pdf
    depends_on:
      - postgres
      - mongo
    volumes:
      - ./RAG:/app/RAG:ro

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:27019:27017"
    volumes:
      - mongo_data:/data/db

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tutor_juridico
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  mongo_data:
  pg_data:
